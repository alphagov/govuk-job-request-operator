---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: reviewed-by-mutation
spec:
  matchConstraints:
    resourceRules:
      - apiGroups: ["platform.publishing.service.gov.uk"]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources:
          - jobrequestreviews
  matchConditions: []
  failurePolicy: Fail
  reinvocationPolicy: IfNeeded
  mutations:
    - patchType: "ApplyConfiguration"
      applyConfiguration:
        expression: >
          Object{
            metadata: Object.metadata{
              annotations: {
                "platform.publishing.service.gov.uk/reviewed-by": request.userInfo.username.split("/")[1].split("-")[0]
              }
            }
          }
