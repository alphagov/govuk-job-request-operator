---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: e2e-admin-permissions
subjects:
{{ range . }}
  - kind: User
    name: {{ .ARN }}
    apiGroup: rbac.authorization.k8s.io
{{ end }}
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
